AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API REST do SIFU para a disciplina de desenvolvimento web.

Parameters:
  StudentName:
    Type: String
    Default: alana
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Nome usado nos recursos da atividade, em letras minusculas.
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_80JtNcIqE
    Description: User Pool Cognito usado no login da aplicacao.
  ApiCustomDomainName:
    Type: String
    Default: api.alanalmeida.sifu5.web.ufersa.dev.br
    Description: Dominio customizado desejado para a API.
  ApiCertificateArn:
    Type: String
    Default: ''
    Description: ARN do certificado ACM em us-east-1 para habilitar o dominio customizado da API.
  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: Modelo Bedrock usado como IA do chatbot quando disponivel no laboratorio.

Conditions:
  HasApiCertificate: !Not [!Equals [!Ref ApiCertificateArn, '']]

Globals:
  Function:
    Timeout: 20
    Runtime: nodejs24.x
    Architectures:
      - x86_64

Resources:
  SifuChatbotApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      Auth:
        DefaultAuthorizer: SifuLambdaAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          SifuLambdaAuthorizer:
            FunctionArn: !GetAtt SifuAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 0

  SifuApiCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasApiCertificate
    Properties:
      DomainName: !Ref ApiCustomDomainName
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref ApiCertificateArn

  SifuApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasApiCertificate
    DependsOn: SifuChatbotApiProdStage
    Properties:
      DomainName: !Ref SifuApiCustomDomain
      RestApiId: !Ref SifuChatbotApi
      Stage: Prod

  SifuProfileBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sifu-${StudentName}-2026.1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - POST
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  SifuProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sifu-${StudentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  SifuChatMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sifu-${StudentName}-chat
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  SifuSubmissionBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sifu-${StudentName}-${AWS::AccountId}-submissions-2026-1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  SifuSubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sifu-${StudentName}-${AWS::AccountId}-submissions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  SifuPdfProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sifu-${StudentName}-${AWS::AccountId}-pdf-processing
      VisibilityTimeout: 180

  SifuAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sifu-${StudentName}-${AWS::AccountId}-authorizer
      CodeUri: lambda/authorizer/
      Handler: app.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId

  SifuChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sifu-chatbot
      CodeUri: lambda/chatbot/
      Handler: app.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          CHAT_MESSAGES_TABLE: !Ref SifuChatMessagesTable
          SUBMISSIONS_TABLE: !Ref SifuSubmissionsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Events:
        ChatbotPost:
          Type: Api
          Properties:
            RestApiId: !Ref SifuChatbotApi
            Path: /chatbot
            Method: post

  SifuSubmissionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sifu-${StudentName}-${AWS::AccountId}-submissions
      CodeUri: lambda/submissions/
      Handler: app.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          SUBMISSION_BUCKET: !Ref SifuSubmissionBucket
          SUBMISSIONS_TABLE: !Ref SifuSubmissionsTable
          PDF_PROCESSING_QUEUE_URL: !Ref SifuPdfProcessingQueue
      Events:
        SubmissionCreate:
          Type: Api
          Properties:
            RestApiId: !Ref SifuChatbotApi
            Path: /submissions
            Method: post
        SubmissionComplete:
          Type: Api
          Properties:
            RestApiId: !Ref SifuChatbotApi
            Path: /submissions/{submissionId}/complete
            Method: post

  SifuPdfProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sifu-${StudentName}-${AWS::AccountId}-pdf-processor
      CodeUri: lambda/pdf-processor/
      Handler: app.handler
      Timeout: 120
      MemorySize: 1024
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref SifuSubmissionsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Events:
        PdfProcessingQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt SifuPdfProcessingQueue.Arn
            BatchSize: 1

  SifuProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sifu-profile
      CodeUri: lambda/profile/
      Handler: app.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          PROFILE_BUCKET: !Ref SifuProfileBucket
          PROFILE_TABLE: !Ref SifuProfileTable
      Events:
        ProfilePut:
          Type: Api
          Properties:
            RestApiId: !Ref SifuChatbotApi
            Path: /profile
            Method: put
            Auth:
              Authorizer: NONE

Outputs:
  ChatbotApiUrl:
    Description: URL da rota POST /chatbot no API Gateway.
    Value: !Sub https://${SifuChatbotApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/chatbot
  ChatbotFunctionName:
    Description: Nome da funcao Lambda criada.
    Value: !Ref SifuChatbotFunction
  ChatMessagesTableName:
    Description: Nome da tabela DynamoDB de historico do chat.
    Value: !Ref SifuChatMessagesTable
  ApiCustomDomainName:
    Description: Dominio customizado planejado para a API.
    Value: !Ref ApiCustomDomainName
  ApiCustomDomainRegionalTarget:
    Condition: HasApiCertificate
    Description: Alvo regional para criar o CNAME do dominio customizado da API.
    Value: !GetAtt SifuApiCustomDomain.RegionalDomainName
  ProfileApiUrl:
    Description: URL da rota PUT /profile no API Gateway.
    Value: !Sub https://${SifuChatbotApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/profile
  ProfileFunctionName:
    Description: Nome da funcao Lambda de perfil.
    Value: !Ref SifuProfileFunction
  ProfileBucketName:
    Description: Nome do bucket S3 de fotos de perfil.
    Value: !Ref SifuProfileBucket
  ProfileTableName:
    Description: Nome da tabela DynamoDB de perfis.
    Value: !Ref SifuProfileTable
  SubmissionsApiUrl:
    Description: URL base das rotas de submissao de pre-projeto.
    Value: !Sub https://${SifuChatbotApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/submissions
  SubmissionBucketName:
    Description: Nome do bucket S3 de PDFs de pre-projeto.
    Value: !Ref SifuSubmissionBucket
  SubmissionsTableName:
    Description: Nome da tabela DynamoDB de submissoes.
    Value: !Ref SifuSubmissionsTable
  PdfProcessingQueueUrl:
    Description: URL da fila SQS de processamento dos PDFs.
    Value: !Ref SifuPdfProcessingQueue
